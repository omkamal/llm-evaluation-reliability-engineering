name: evals
on:
  pull_request:
    paths:
      - 'ch15_cicd/relay/prompts/**'
      - 'ch15_cicd/relay/schemas/**'
      - 'ch15_cicd/relay/config/**'
      - 'ch15_cicd/relay/evals/**'
  schedule:
    - cron: '0 3 * * *'           # nightly, 03:00 UTC
  push:
    tags: ['v*']                  # release tags
  workflow_dispatch:              # a manual smoke run
concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: write
jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 15           # a runaway run stops itself
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip              # keyed on requirements.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ch15_cicd.guard
      - if: >-
          github.event_name == 'pull_request' ||
          github.event_name == 'workflow_dispatch'
        run: >-
          python -m ch15_cicd.run_tier --sample 50
          --seed ${{ github.run_number }}
      - if: github.event_name == 'schedule'
        run: python -m ch15_cicd.run_tier --trials 3
      - if: startsWith(github.ref, 'refs/tags/v')
        run: python -m ch15_cicd.run_tier --trials 5 --safety
      - name: Gate
        shell: bash
        run: |
          python -m ch15_cicd.gate \
            --baseline ch15_cicd/relay/evals/baseline/main.json \
            --results results/scores.json \
            --thresholds ch15_cicd/relay/evals/thresholds.json \
            | tee results/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Comment on the pull request
        if: >-
          always() && github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name ==
          github.repository && hashFiles('results/report.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: >-
          gh pr comment "$PR" --edit-last --create-if-none
          --body-file results/report.md
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eval-results
          path: results/
