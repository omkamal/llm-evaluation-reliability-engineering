name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Run every chapter demo
        run: |
          for d in ch*/demo.py; do
            m="${d%/demo.py}"
            echo "== $m"
            python -m "$m.demo"
          done
      - run: python -m ch03_first_eval.run_evals v1
      - run: python -m ch03_first_eval.run_evals v2
